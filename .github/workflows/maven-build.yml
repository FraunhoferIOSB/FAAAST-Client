name: Maven Build

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v7
      with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
        fetch-depth: 0

    - name: Cache maven repository
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.sonar/cache
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Build with Maven
      run: |
        mvn test-compile --settings maven-ci-settings.xml -B

    - name: Test with Coverage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn install sonar:sonar -P coverage -Dsonar.projectKey=FraunhoferIOSB_FAAAST-Client --settings maven-ci-settings.xml -B

    - name: Set env variables
      run: |
        echo "Exporting Variables"
        export version=$(mvn -Dexec.executable='echo' -Dexec.args='${project.version}' --non-recursive exec:exec -q)
        echo "VERSION=${version}"     >> $GITHUB_ENV

    - name: Set up GnuPG
      if: ${{ endsWith(env.VERSION, '-SNAPSHOT') }}
      env:
        GPG_EXECUTABLE: gpg
        GPG_SECRET_KEYS: ${{ secrets.GPG_SECRET_KEYS }}
        GPG_OWNERTRUST: ${{ secrets.GPG_OWNERTRUST }}
      run: |
        mkdir -p -m 700 "$HOME/.gnupg"
    
        printf '%s\n' 'use-agent' > "$HOME/.gnupg/gpg.conf"
        printf '%s\n' 'pinentry-mode loopback' >> "$HOME/.gnupg/gpg.conf"
        printf '%s\n' 'allow-loopback-pinentry' > "$HOME/.gnupg/gpg-agent.conf"
    
        printf '%s' "$GPG_SECRET_KEYS" |
          base64 --decode |
          "$GPG_EXECUTABLE" --yes --batch --import
    
        printf '%s' "$GPG_OWNERTRUST" |
          base64 --decode |
          "$GPG_EXECUTABLE" --yes --batch --import-ownertrust

    - name: Deploy SNAPSHOTS
      if:  ${{ endsWith(env.VERSION, '-DONTRUNSNAPSHOT') }}
      env:
        GPG_EXECUTABLE: gpg
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      run: mvn clean deploy -P release --settings maven-ci-settings.xml -B
